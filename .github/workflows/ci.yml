# Tests and builds the extension on every push.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: curl -fsS https://iguigova.github.io/brand.css -o ../brand.css
      - run: curl -fsS https://iguigova.github.io/brand.js -o ../brand.js
      - run: npm run build
